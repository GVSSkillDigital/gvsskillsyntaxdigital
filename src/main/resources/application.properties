
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/av_training_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# JWT AUTHENTICATION CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Refresh token validity: 7 days
app.refresh.expiration-days=7


# ==========================================
# FRONTEND CONFIGURATION
# ==========================================
app.frontend.url=http://localhost:4200


# ==========================================
# REFRESH TOKEN COOKIE CONFIGURATION
# ==========================================
# false for localhost development
# Change to true when using HTTPS in production
app.cookie.secure=false


# ==========================================
# EMAIL CONFIGURATION
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sagarbabutm.tech@gmail.com
